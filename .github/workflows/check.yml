name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install validation tools
        run: pacman --sync --refresh --sysupgrade --noconfirm git jq lua shellcheck shfmt stylua
      - uses: actions/checkout@v4
      - name: Run portable checks
        run: ./scripts/check.sh --portable
